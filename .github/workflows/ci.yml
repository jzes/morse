name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Validate Go project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/morse" .
      - name: Check CLI examples
        run: |
          test "$("$RUNNER_TEMP/morse" '... --- ...')" = 'sos'
          test "$(printf '%s' '.... . .-.. .-.. ---  .-- --- .-. .-.. -..' | "$RUNNER_TEMP/morse")" = 'hello world'
