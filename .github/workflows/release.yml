name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          name="morse_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p dist package
          binary=morse
          if [ "$GOOS" = windows ]; then
            binary=morse.exe
          fi
          go build -trimpath -ldflags='-s -w' -o "package/$binary" .
          cp README.md LICENSE package/
          if [ "$GOOS" = windows ]; then
            (cd package && zip "../dist/$name.zip" "$binary" README.md LICENSE)
          else
            tar -czf "dist/$name.tar.gz" -C package "$binary" README.md LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: morse-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: morse-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" dist/* \
            --verify-tag \
            --title "Morse $VERSION" \
            --generate-notes \
            "${flags[@]}"
